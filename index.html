<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Leaf Blower</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
    🍂 Score: <span id="score">0</span><br>
    ⏱️ Time: <span id="time">60</span>
</div>

<div id="start">
    <div class="box">
        <h1>🍂 Leaf Blower</h1>
        <p>Clean up the park before the sun goes down!</p>
        <p>Move your mouse and hold the button to blow the leaves away.</p>
        <button onclick="startGame()">Start</button>
    </div>
</div>

<div id="end">
    <div class="box">
        <h1>🌅 Sunset!</h1>
        <p>You cleaned up the park.</p>
        <h2>Score: <span id="finalScore">0</span></h2>
        <button onclick="startGame()">Play Again</button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
